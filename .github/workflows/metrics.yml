---
# Render profile metrics with lowlighter/metrics and publish them to the "metrics" branch.
name: Generate profile metrics

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Render overview card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none
          filename: metrics-overview.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Paris
          config_display: large

      - name: Render languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none
          filename: metrics-languages.svg
          template: classic
          base: ""
          config_timezone: Europe/Paris
          plugin_languages: true
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss

      - name: Collect the rendered SVGs
        run: |
          ls -la /metrics_renders
          mkdir -p dist
          cp /metrics_renders/metrics-overview.svg \
            /metrics_renders/metrics-languages.svg dist/

      - name: Push the SVGs to the metrics branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: metrics
          build_dir: dist
          commit_message: "chore: update profile metrics"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
